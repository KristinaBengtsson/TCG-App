<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MasterCollect - wishlist</title>
  <link rel="stylesheet" href="style.css">
    <script src="js/sidebar.js" defer></script>
    <script src="js/mastersets.js" defer></script>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">MasterCollect</div>
    <button class="menu-button hover-purple">Søg kort</button>

  <button class="menu-button hover-purple">Dashboard</button>
  <button class="menu-button hover-purple">Collection</button>
  <button class="menu-button hover-purple">Master Sets</button>
  <button class="menu-button active">Wishlist</button>
</div>

<!-- PROFILE BOX BOTTOM SIDEBAR -->
<div class="profile-box" id="profileButton">
    <div class="avatar-circle" th:text="${#strings.toUpperCase(#strings.substring(session.user.username,0,1))}">S</div>
    <div>
        <div class="profile-name" th:text="${#strings.capitalize(session.user.username)}">Sofus J.</div>
        <div class="profile-cards">247 cards</div>
    </div>
</div>


<!-- MAIN CONTENT -->
<div class="content">

  <div class="profile-header">

    <div>
      <h1>Wishlist</h1>
      <p>Manage your wishlist, add and remove cards.</p>
    </div>
  </div>


      <div class="profile-stat-card">

                    <span class="profile-stat-label">
                        Wishlist
                    </span>

        <strong>
          4
        </strong>

        <span>
                        Wanted cards
                    </span>

      </div>

    </div>
  </div>
</div>
</body>
</html>
