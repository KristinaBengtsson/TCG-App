<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterCollect - login</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">

<div class="login-box">
    <div class="logo">MasterCollect</div>
    <h1>Log ind</h1>
    <p class="login-subtitle">Track your collaction and master your sets.</p>

    <!-- Fejlbeskeden vises kun, hvis controlleren har sat "error" -->
    <p class="login-error" th:if="${error}" th:text="${error}">Wrong username or password</p>

    <!-- Vises efter man har oprettet en bruger -->
    <p class="login-message" th:if="${message}" th:text="${message}">Your user was succesfully created</p>

    <form action="/login" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="top-button primary">Log in</button>
    </form>
    <a class="login-guest-link" href="/createuser">New User? Create an account here</a>
    <a class="login-guest-link" href="/cards">Search for cards without an account →</a>
</div>

</body>
</html>
