<!DOCTYPE html>
<html lang="en">
<head>

    <title>MasterCollect - dashboard</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<!--MENU -->
<div class="sidebar">
    <div class="logo">MasterCollect</div>

    <button class="menu-button active">Dashboard</button>
    <button class="menu-button">Collection</button>
    <button class="menu-button">Master Sets</button>
    <button class="menu-button">Wishlist</button>
</div>
<!-- PROFILE BOX BOTTOM SIDEBAR -->
<div class="profile-box">
    <div class="avatar-circle">S</div>
    <div>
        <div class="profilename">Sofus K.</div>
        <div class="profile-cards">247 cards</div>
    </div>
</div>
<!-- MAIN CONTENT -->
<div class="content">

        <div class ="top-text">
            <h1>Good evening, Sofus</h1>
            <p>Here is your collection at a glance.</p>
        </div>
        <div>
            <button class="top-button outline">+ Add card</button>
        </div>
    </div>

<!-- STAT BOXES -->


</div>

</html>
